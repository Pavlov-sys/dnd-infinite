<!doctype html>
<html><head>
<!-- Source for img/logo/infinity-codex-wordmark.png. Open in a browser and screenshot #wm with a transparent background. Font: Cinzel (SIL Open Font License). -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .wm { display: inline-flex; flex-direction: column; align-items: center; padding: 10px 24px 14px; color: #fff; font-family: 'Cinzel', serif; }
  .top { font-weight: 900; font-size: 190px; line-height: 1.05; letter-spacing: .02em; }
  .bottom { display: flex; align-items: center; gap: 30px; margin-top: 4px; width: 100%; }
  .bottom span { font-weight: 700; font-size: 74px; line-height: 1; letter-spacing: .32em; margin-right: -.32em; }
  .line { flex: 1; height: 7px; }
  .l { background: linear-gradient(90deg, rgba(255,255,255,0), #fff); clip-path: polygon(0 50%, 100% 0, 100% 100%); }
  .r { background: linear-gradient(270deg, rgba(255,255,255,0), #fff); clip-path: polygon(0 0, 100% 50%, 0 100%); }
</style></head>
<body><div class="wm" id="wm"><div class="top">INFINITY</div><div class="bottom"><i class="line l"></i><span>CODEX</span><i class="line r"></i></div></div></body></html>
